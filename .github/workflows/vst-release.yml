name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.3.0
        required: true
        default: 0.3.0
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: true

jobs:
  riffbox:
    uses: open-mpc/mpc-vst-plugins/.github/workflows/vst-release.yml@1ae4e53976cdc0f010b07cf5c5bdddc56108b26b
    permissions:
      contents: write
    with:
      tag: riffbox-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 1ae4e53976cdc0f010b07cf5c5bdddc56108b26b
      vst_dir: vst
      build: bash vst/build.sh
      host_test: bash vst/test.sh
      plugin_id: riffbox
      license: MIT
      about: Electric guitar chords per note - RAT pedal, five amp models, aftertouch bend/vibrato/feedback/wah, tempo delay.
      dry_run: ${{ inputs.dry_run }}
