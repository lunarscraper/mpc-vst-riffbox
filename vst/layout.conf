# RiffBox MPC skin layout, Force-Look (0.3.0): large type, big touch targets and a colourful page of its own (gradient,
# light rays, dark panels behind the controls), arc knobs, big rounded option segments - the look of Rattler 1.1.
# Each page: its name at the top left, two framed rows of four controls = Q-Links 1-4 and 5-8.
# Q-Links only carry knobs and selectors; switches (STROKE, DOUBLE, PING PONG) are touch only, as two or three
# big segments. force_look.py (vst.json "skin_post") repaints the generator's images and draws the
# #@title / #@frame / #@text lines (comments for the generator); coordinates in shadow pixels.
# Palette: amp-red tolex with tube-amber light.
style=plain
font_label=fonts/DejaVuSans-Bold.ttf
label_scale=1.5
scale_names=1
theme_bg=3a0d10
theme_ink=ffffff
theme_ink_dim=ffc45a
theme_accent=ffa21e
theme_lcd=1e0507
theme_panel=3a0d10
theme_box=3a0d10
theme_accent_hi=ffffff
theme_ink_faint=3a0d10
#@look bg_top=1f0609 bg_bottom=5a1a12 glow=c2541c ray1=ff8a2a ray2=a8281e ray_alpha=42 panel=140405 frame=ffa21e frame_text=2a0a05 title=ffffff sub=ffcf8a text=fff2e2 knob_face=4a1612 knob_rim=9a3a22 knob_track=5e2a1e knob_arc=ffa21e pointer=ffffff slider_track=5e2a1e slider_fill=ffa21e slider_cap=ffffff slider_cap_line=4a1612 btn=7a2a16 btn_ring=ffa21e btn_text=ffffff btn_down=ffa21e btn_down_text=2a0a05 seg=4a1612 seg_ring=b0562e seg_text=ffe8d2 seg_on=ffa21e seg_on_ring=ffffff seg_on_text=2a0a05 pill_off=4a1612 pill_on=ffa21e pill_dot=ffffff list=170506 list_ring=ffa21e opt=3a1010 opt_text=fff2e2 opt_on=ffa21e opt_on_text=2a0a05

[tab PLAY]
#@title text="PLAY" sub="RIFFBOX 0.3"
#@frame x=20 y=156 w=1240 h=270 title="CHORD"
popup cx=175 cy=240 w=280 h=68 label="" key=shape
#@text cx=175 cy=314 label="CHORD" size=29
knob cx=485 cy=240 r=51 label="OCTAVE" key=octave
knob cx=795 cy=240 r=52 label="STRUM" key=strum
enum_h cx=1105 cy=240 label="" key=stroke sw=96 sh=68
#@text cx=1105 cy=314 label="STROKE" size=29
#@frame x=20 y=438 w=1240 h=262 title="HAND"
knob cx=175 cy=522 r=52 label="PALM MUTE" key=mute
knob cx=485 cy=522 r=52 label="SUSTAIN" key=sustain
knob cx=795 cy=522 r=52 label="PICK TONE" key=bright
knob cx=1105 cy=522 r=52 label="RELEASE" key=release
qlinks "PLAY" = shape,octave,strum,-,mute,sustain,bright,release

[tab PEDAL]
#@title text="PEDAL" sub="RIFFBOX 0.3"
#@frame x=20 y=156 w=1240 h=270 title="RAT"
popup cx=175 cy=240 w=280 h=68 label="" key=pedal
#@text cx=175 cy=314 label="PEDAL" size=29
knob cx=485 cy=240 r=52 label="DISTORTION" key=ped_dist
knob cx=795 cy=240 r=52 label="FILTER" key=ped_filter
knob cx=1105 cy=240 r=52 label="LEVEL" key=ped_level
#@frame x=20 y=438 w=1240 h=262 title="INTO THE AMP"
popup cx=175 cy=522 w=280 h=68 label="" key=amp
#@text cx=175 cy=596 label="AMP" size=29
knob cx=485 cy=522 r=52 label="GAIN" key=gain
knob cx=1105 cy=522 r=52 label="VOLUME" key=volume
qlinks "PEDAL" = pedal,ped_dist,ped_filter,ped_level,amp,gain,-,volume

[tab AMP]
#@title text="AMP" sub="RIFFBOX 0.3"
#@frame x=20 y=156 w=1240 h=270 title="AMP"
popup cx=175 cy=240 w=280 h=68 label="" key=amp
#@text cx=175 cy=314 label="AMP" size=29
knob cx=485 cy=240 r=52 label="GAIN" key=gain
knob cx=795 cy=240 r=52 label="VOLUME" key=volume
enum_h cx=1105 cy=240 label="" key=double sw=145 sh=68
#@text cx=1105 cy=314 label="DOUBLE" size=29
#@frame x=20 y=438 w=1240 h=262 title="TONE STACK"
knob cx=175 cy=522 r=53 label="BASS" key=bass
knob cx=485 cy=522 r=53 label="MID" key=mid
knob cx=795 cy=522 r=53 label="TREBLE" key=treble
