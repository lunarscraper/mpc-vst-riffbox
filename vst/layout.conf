# RAT MPC skin layout, one tab: the pedal's three knobs big (DISTORTION, FILTER, VOLUME, as on
# r=56 statt 60: Filmstrip 122x15616 px bleibt unter 16384 px (r=60 ergab 130x16640 und verrutschte auf dem Geraet).
# Rahmentitel leer: "RAT" steht schon in MPCs Kopfzeile, der eingebrannte Bitmap-Titel war winzig.
# the pedal), the diode choice, the Ruetz mod, input level and dry/wet mix below.
# Palette: black enclosure, white print, red LED.
style=td3
theme_bg=111111
theme_panel=111111
theme_line=000000
theme_ink=f2f2f2
theme_ink_dim=a0a0a0
theme_ink_faint=555555
theme_accent=e8302a
theme_accent_hi=ff6a5c
theme_knob_face=262626
theme_knob_ring=000000
theme_bar=e8302a
theme_seg_active=e8302a
theme_seg_inactive=262626
theme_seg_active_tx=111111
theme_btn_text=111111
theme_well=000000
theme_knob_off=444444
theme_tab_on=e8302a
theme_tab_on_tx=111111
theme_lcd=140404
theme_box=0a0a0a
theme_btn_bg=f2f2f2
theme_chrome_ink=f2f2f2
theme_go_on=e8302a
theme_go_off=ff6b4a
theme_tabs=e8302a

[tab RAT]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=250 cy=260 r=56 label="DISTORTION" key=dist
knob cx=640 cy=260 r=56 label="FILTER" key=filter
knob cx=1030 cy=260 r=56 label="VOLUME" key=volume
popup cx=230 cy=540 w=220 h=48 label="DIODES" key=diodes
toggle cx=500 cy=540 label="RUETZ" key=ruetz
knob cx=780 cy=550 r=42 label="INPUT" key=input
knob cx=1030 cy=550 r=42 label="MIX" key=mix
qlinks "RAT" = dist,filter,volume,diodes,ruetz,input,mix
