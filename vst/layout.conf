# RiffBox MPC skin layout, five tabs:
#   PLAY   chord shape (popup), octave, strum time and direction, palm mute, sustain, pick tone,
#          release, double
#   PEDAL  a RAT in front of the amp (popup: off, RAT, TURBO, GE, RUETZ), distortion, filter, level
#   AMP    amp model (popup), gain, bass/mid/treble, volume
#   TOUCH  what aftertouch does: vibrato, bend, feedback, wah, gain
#   DELAY  time (popup, tempo-synced), feedback, mix, ping-pong
# Palette: black tolex, cream piping, tube-amber accent.
style=td3
theme_bg=1c1a18
theme_panel=1c1a18
theme_line=000000
theme_ink=efe6d2
theme_ink_dim=a39a88
theme_ink_faint=5e584e
theme_accent=ff8a1e
theme_accent_hi=ffb15e
theme_knob_face=2e2b27
theme_knob_ring=050505
theme_bar=ff8a1e
theme_seg_active=ff8a1e
theme_seg_inactive=2e2b27
theme_seg_active_tx=1c1a18
theme_btn_text=1c1a18
theme_well=000000
theme_knob_off=4a4640
theme_tab_on=ff8a1e
theme_tab_on_tx=1c1a18
theme_lcd=140c04
theme_box=12100e
theme_btn_bg=efe6d2
theme_chrome_ink=efe6d2
theme_go_on=ff8a1e
theme_go_off=ff4a3a
theme_tabs=ff8a1e

[tab PLAY]
frame x=36 y=88 w=1207 h=624 title="PLAY"
popup cx=220 cy=200 w=240 h=48 label="CHORD" key=shape
knob cx=500 cy=210 r=34 label="OCTAVE" key=octave
knob cx=720 cy=210 r=34 label="STRUM" key=strum
enum_h cx=1000 cy=200 label="STROKE" key=stroke sw=90
knob cx=160 cy=500 r=34 label="PALM MUTE" key=mute
knob cx=380 cy=500 r=34 label="SUSTAIN" key=sustain
knob cx=600 cy=500 r=34 label="PICK TONE" key=bright
knob cx=820 cy=500 r=34 label="RELEASE" key=release
toggle cx=1060 cy=500 label="DOUBLE" key=double
qlinks "PLAY" = shape,octave,strum,stroke,mute,sustain,bright,release,double

[tab PEDAL]
frame x=36 y=88 w=1207 h=624 title="PEDAL"
popup cx=640 cy=170 w=300 h=48 label="PEDAL" key=pedal
knob cx=250 cy=420 r=34 label="DISTORTION" key=ped_dist
knob cx=640 cy=420 r=34 label="FILTER" key=ped_filter
knob cx=1030 cy=420 r=34 label="LEVEL" key=ped_level
qlinks "PEDAL" = pedal,ped_dist,ped_filter,ped_level

[tab AMP]
frame x=36 y=88 w=1207 h=624 title="AMP"
popup cx=260 cy=200 w=300 h=48 label="AMP" key=amp
knob cx=640 cy=230 r=34 label="GAIN" key=gain
knob cx=1000 cy=230 r=34 label="VOLUME" key=volume
knob cx=300 cy=500 r=34 label="BASS" key=bass
knob cx=640 cy=500 r=34 label="MID" key=mid
knob cx=980 cy=500 r=34 label="TREBLE" key=treble
qlinks "AMP" = amp,gain,bass,mid,treble,volume

[tab TOUCH]
frame x=36 y=88 w=1207 h=624 title="AFTERTOUCH"
knob cx=200 cy=360 r=34 label="VIBRATO" key=at_vib
knob cx=420 cy=360 r=34 label="BEND" key=at_bend
knob cx=640 cy=360 r=34 label="FEEDBACK" key=at_fb
knob cx=860 cy=360 r=34 label="WAH" key=at_wah
knob cx=1080 cy=360 r=34 label="GAIN" key=at_gain
qlinks "TOUCH" = at_vib,at_bend,at_fb,at_wah,at_gain

[tab DELAY]
frame x=36 y=88 w=1207 h=624 title="DELAY"
popup cx=260 cy=330 w=220 h=48 label="TIME" key=dly_time
knob cx=560 cy=350 r=34 label="FEEDBACK" key=dly_fb
knob cx=820 cy=350 r=34 label="MIX" key=dly_mix
toggle cx=1060 cy=330 label="PING PONG" key=dly_pp
qlinks "DELAY" = dly_time,dly_fb,dly_mix,dly_pp
