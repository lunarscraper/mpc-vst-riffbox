[tab TOUCH]
#@title text="TOUCH" sub="RIFFBOX 0.3"
#@frame x=20 y=156 w=1240 h=270 title="AFTERTOUCH"
knob cx=175 cy=240 r=52 label="VIBRATO" key=at_vib
knob cx=485 cy=240 r=52 label="BEND" key=at_bend
knob cx=795 cy=240 r=52 label="FEEDBACK" key=at_fb
knob cx=1105 cy=240 r=52 label="WAH" key=at_wah
#@frame x=20 y=438 w=1240 h=262 title="AFTERTOUCH"
knob cx=175 cy=522 r=52 label="GAIN" key=at_gain
#@text cx=800 cy=548 label="Druck auf die Pads: jeder Regler = Stärke" size=26 color=sub
qlinks "TOUCH" = at_vib,at_bend,at_fb,at_wah,at_gain

[tab DELAY]
#@title text="DELAY" sub="RIFFBOX 0.3"
#@frame x=20 y=156 w=1240 h=270 title="TEMPO DELAY"
popup cx=175 cy=240 w=280 h=68 label="" key=dly_time
#@text cx=175 cy=314 label="TIME" size=29
knob cx=485 cy=240 r=52 label="FEEDBACK" key=dly_fb
knob cx=795 cy=240 r=52 label="MIX" key=dly_mix
enum_h cx=1105 cy=240 label="" key=dly_pp sw=145 sh=68
#@text cx=1105 cy=314 label="PING PONG" size=29
#@frame x=20 y=438 w=1240 h=262 title="OUTPUT"
knob cx=175 cy=522 r=52 label="VOLUME" key=volume
#@text cx=800 cy=548 label="TIME folgt dem Tempo der Force" size=26 color=sub
qlinks "DELAY" = dly_time,dly_fb,dly_mix,-,volume
